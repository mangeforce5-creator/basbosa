<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Song For You 🎵</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Dancing+Script:wght@700&family=Pacifico&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Tajawal', sans-serif;
            background: #1a0a1a;
        }

        /* ===== SPLASH SCREEN ===== */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #ff69b4, #ff1493, #ff85c8, #ff69b4, #c71585);
            background-size: 400% 400%;
            animation: gradientShift 6s ease infinite;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 1s ease, transform 1s ease;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #splash-screen.hide {
            opacity: 0;
            transform: scale(1.2);
            pointer-events: none;
        }

        .splash-title {
            font-family: 'Pacifico', cursive;
            font-size: 5rem;
            color: white;
            text-shadow: 0 0 30px rgba(255,255,255,0.5), 0 0 60px rgba(255,105,180,0.5);
            animation: titlePulse 2s ease-in-out infinite;
            z-index: 10;
            text-align: center;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 30px rgba(255,255,255,0.5); }
            50% { transform: scale(1.05); text-shadow: 0 0 50px rgba(255,255,255,0.8), 0 0 80px rgba(255,105,180,0.6); }
        }

        .splash-subtitle {
            font-family: 'Tajawal', sans-serif;
            font-size: 1.3rem;
            color: rgba(255,255,255,0.85);
            margin-top: 20px;
            animation: fadeInUp 2s ease 0.5s both;
            z-index: 10;
            letter-spacing: 3px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .click-hint {
            position: absolute;
            bottom: 60px;
            font-size: 1rem;
            color: rgba(255,255,255,0.7);
            animation: blink 1.5s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Floating Hearts on Splash */
        .floating-heart {
            position: absolute;
            font-size: 2rem;
            color: rgba(255,255,255,0.4);
            animation: floatUp linear infinite;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Sparkle particles */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            animation: sparkleFloat linear infinite;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes sparkleFloat {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 1; transform: translateY(80vh) scale(1); }
            80% { opacity: 0.8; }
            100% { transform: translateY(-50px) scale(0); opacity: 0; }
        }

        /* ===== TEDDY BEAR SCREEN ===== */
        #teddy-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(180deg, #2d0a2e, #1a0520, #0d0210);
            z-index: 500;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 1s ease;
        }

        #teddy-screen.show {
            display: flex;
        }

        #teddy-screen.hide {
            opacity: 0;
            pointer-events: none;
        }

        .teddy-container {
            animation: teddyBounce 2s ease-in-out infinite;
            text-align: center;
        }

        @keyframes teddyBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .teddy-svg {
            width: 280px;
            height: 320px;
            filter: drop-shadow(0 0 40px rgba(255,105,180,0.4));
        }

        .teddy-text {
            font-family: 'Pacifico', cursive;
            font-size: 2rem;
            color: #ff69b4;
            margin-top: 25px;
            animation: fadeInUp 1s ease 0.5s both;
            text-shadow: 0 0 20px rgba(255,105,180,0.5);
        }

        .teddy-hint {
            position: absolute;
            bottom: 50px;
            font-size: 0.95rem;
            color: rgba(255,105,180,0.6);
            animation: blink 1.5s ease-in-out infinite;
        }

        /* Mini hearts around teddy */
        .mini-heart {
            position: absolute;
            color: #ff69b4;
            animation: miniFloat 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes miniFloat {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
            50% { transform: translateY(-20px) scale(1.2); opacity: 1; }
        }

        /* ===== LYRICS SCREEN ===== */
        #lyrics-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(180deg, #1a0520, #0d0210, #050008);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #lyrics-screen.show {
            display: flex;
        }

        /* Background animated hearts for lyrics */
        .bg-heart {
            position: absolute;
            font-size: 1.5rem;
            color: rgba(255,105,180,0.08);
            animation: bgFloat linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes bgFloat {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(180deg); opacity: 0; }
        }

        .lyrics-line {
            font-family: 'Tajawal', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            color: white;
            text-align: center;
            padding: 0 40px;
            line-height: 1.6;
            opacity: 0;
            transform: translateY(40px) scale(0.9);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: absolute;
            z-index: 10;
            text-shadow: 0 0 40px rgba(255,105,180,0.4), 0 2px 10px rgba(0,0,0,0.5);
            max-width: 90%;
        }

        .lyrics-line.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .lyrics-line.exit {
            opacity: 0;
            transform: translateY(-40px) scale(0.9);
        }

        /* Progress bar */
        .progress-container {
            position: absolute;
            bottom: 30px;
            width: 80%;
            max-width: 500px;
            height: 6px;
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
            z-index: 10;
            direction: ltr;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff69b4, #ff1493);
            border-radius: 3px;
            width: 0%;
            position: relative;
            box-shadow: 0 0 10px rgba(255,105,180,0.5);
        }

        /* Heart icon in progress */
        .progress-heart {
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 1.2rem;
            animation: heartBeat 1s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        /* Control buttons */
        .controls {
            position: absolute;
            bottom: 60px;
            display: flex;
            gap: 15px;
            z-index: 20;
        }

        .ctrl-btn {
            background: rgba(255,105,180,0.15);
            border: 1px solid rgba(255,105,180,0.3);
            color: #ff69b4;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 1rem;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .ctrl-btn:hover {
            background: rgba(255,105,180,0.3);
            border-color: rgba(255,105,180,0.6);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255,105,180,0.3);
        }

        /* End screen */
        .end-message {
            font-family: 'Pacifico', cursive;
            font-size: 3rem;
            color: #ff69b4;
            text-align: center;
            opacity: 0;
            transform: scale(0.5);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
            text-shadow: 0 0 30px rgba(255,105,180,0.5);
        }

        .end-message.show {
            opacity: 1;
            transform: scale(1);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .splash-title { font-size: 3rem; }
            .lyrics-line { font-size: 1.8rem; padding: 0 20px; }
            .teddy-svg { width: 200px; height: 240px; }
            .teddy-text { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- ===== SPLASH SCREEN ===== -->
    <div id="splash-screen">
        <div class="splash-title">Song For You 🎵</div>
        <div class="splash-subtitle">✨أغنية بحسها معموله مخصوص ليكي✨</div>
        <div class="click-hint">💖 اضغط في أي مكان 💖</div>
    </div>

    <!-- ===== TEDDY BEAR SCREEN ===== -->
    <div id="teddy-screen">
        <div class="teddy-container">
            <!-- Teddy Bear SVG -->
            <svg class="teddy-svg" viewBox="0 0 300 350" xmlns="http://www.w3.org/2000/svg">
                <!-- Ears -->
                <circle cx="85" cy="65" r="45" fill="#c4956a"/>
                <circle cx="85" cy="65" r="28" fill="#e8b88a"/>
                <circle cx="215" cy="65" r="45" fill="#c4956a"/>
                <circle cx="215" cy="65" r="28" fill="#e8b88a"/>
                <!-- Head -->
                <circle cx="150" cy="110" r="80" fill="#d4a574"/>
                <!-- Face -->
                <ellipse cx="150" cy="130" rx="45" ry="35" fill="#e8c9a0"/>
                <!-- Eyes -->
                <circle cx="120" cy="100" r="10" fill="#2c1810"/>
                <circle cx="180" cy="100" r="10" fill="#2c1810"/>
                <circle cx="123" cy="96" r="4" fill="white"/>
                <circle cx="183" cy="96" r="4" fill="white"/>
                <!-- Nose -->
                <ellipse cx="150" cy="120" rx="10" ry="7" fill="#2c1810"/>
                <!-- Mouth -->
                <path d="M140 130 Q150 142 160 130" stroke="#2c1810" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <!-- Blush -->
                <circle cx="105" cy="120" r="12" fill="rgba(255,105,180,0.35)"/>
                <circle cx="195" cy="120" r="12" fill="rgba(255,105,180,0.35)"/>
                <!-- Body -->
                <ellipse cx="150" cy="250" rx="85" ry="90" fill="#d4a574"/>
                <!-- Belly -->
                <ellipse cx="150" cy="250" rx="55" ry="60" fill="#e8c9a0"/>
                <!-- Arms -->
                <ellipse cx="60" cy="230" rx="30" ry="50" fill="#d4a574" transform="rotate(-15, 60, 230)"/>
                <ellipse cx="240" cy="230" rx="30" ry="50" fill="#d4a574" transform="rotate(15, 240, 230)"/>
                <!-- Paws -->
                <circle cx="48" cy="268" r="18" fill="#c4956a"/>
                <circle cx="252" cy="268" r="18" fill="#c4956a"/>
                <!-- Legs -->
                <ellipse cx="110" cy="330" rx="35" ry="25" fill="#d4a574"/>
                <ellipse cx="190" cy="330" rx="35" ry="25" fill="#d4a574"/>
                <ellipse cx="110" cy="335" rx="22" ry="14" fill="#c4956a"/>
                <ellipse cx="190" cy="335" rx="22" ry="14" fill="#c4956a"/>
                <!-- Heart the teddy is holding -->
                <g transform="translate(150, 230) scale(0.9)">
                    <path d="M0,-15 C-5,-30 -25,-30 -25,-15 C-25,0 0,20 0,25 C0,20 25,0 25,-15 C25,-30 5,-30 0,-15Z" fill="#ff1493">
                        <animate attributeName="d" dur="1s" repeatCount="indefinite"
                            values="M0,-15 C-5,-30 -25,-30 -25,-15 C-25,0 0,20 0,25 C0,20 25,0 25,-15 C25,-30 5,-30 0,-15Z;
                                    M0,-18 C-6,-34 -28,-34 -28,-18 C-28,0 0,23 0,28 C0,23 28,0 28,-18 C28,-34 6,-34 0,-18Z;
                                    M0,-15 C-5,-30 -25,-30 -25,-15 C-25,0 0,20 0,25 C0,20 25,0 25,-15 C25,-30 5,-30 0,-15Z"/>
                    </path>
                </g>
            </svg>
            <div class="teddy-text">💕هديه ليكي💕</div>
        </div>
        <div class="teddy-hint">💖دوسي ياحبيبي💖</div>
    </div>

    <!-- ===== LYRICS SCREEN ===== -->
    <div id="lyrics-screen">
        <audio id="audio-player" src="song.mp3" preload="auto"></audio>
        <div class="lyrics-line" id="lyrics-display"></div>
        <div class="end-message" id="end-message">💖 love you 💖</div>
        <div class="progress-container" id="progress-container" style="cursor: pointer;" title="انقر للتنقل في الأغنية">
            <div class="progress-bar" id="progress-bar">
                <span class="progress-heart">💗</span>
            </div>
        </div>
        <div class="controls">
            <button class="ctrl-btn" id="play-pause-btn" onclick="togglePlayPause()">⏸ إيقاف مؤقت</button>
            <button class="ctrl-btn" onclick="resetLyrics()">🔄 من الأول</button>
        </div>
    </div>

    <script>
        // ===================================================
        // 🎵 اكتب الليركس بتاعتك هنا! 🎵
        // ===================================================
        // كل سطر فيه:
        //   text: الكلام اللي عايزه يظهر
        //   start: يبدأ يظهر بعد كام ثانية
        //   end: يختفي بعد كام ثانية
        // ===================================================
        const lyrics = [
            { text: "💞", start: 0, end: 0.8 },
            { text: "بسبوسة", start: 0.9, end: 1.7 },
            { text: "بسبوسة", start: 2, end: 3 },
            { text: "بسبوسة", start: 3.2, end: 4.2 },
            { text: "بسبوسة", start: 4.4, end: 5.7 },
            { text: "'بسبوسة'", start: 5.9, end: 6.8 },
            { text: "'بسبوسة'", start: 7, end: 8.2 },
            { text: "💕بت يا نوزا 💕", start: 8.4, end: 9.3 },
            { text: "💕يا نوزا💕", start: 9.6, end: 10.2 },
            { text: "💕شايله البسبوسة💕", start: 10.4, end: 12.5 },
            { text: "💕والله احلويتي💕", start: 12.8, end: 14.1 },
            { text: "💕وكبرتي💕", start: 14.3, end: 14.9 },
            { text: "💕وبقيتي عروسة💕", start: 15.1, end: 16.4 },
            { text: "💞", start: 16.5, end: 17.2 },
            { text: "💕بت يا نوزا💕", start: 17.4, end: 18.5 },
            { text: "💕يا نوزا💕", start: 18.8, end: 19.6 },
            { text: "💕شايله البسبوسة💕", start: 19.8, end: 21.9 },
            { text: "💕والله احلويتي💕", start: 22.1, end: 23.4 },
            { text: "💕وكبرتي💕", start: 23.6, end: 24.4 },
            { text: "💕وبقيتي عروسة💕", start: 24.6, end: 25.6 },
            { text: "💞", start: 25.8, end: 30 },

            // ===================================================
            // 🔽 اضيف سطور جديدة هنا 🔽
            // مثال: { text: "الكلام", start: 28, end: 32 },
            // ===================================================
        ];

        // ===================================================
        // حساب المدة الكلية
        // ===================================================
        const totalDuration = lyrics.length > 0 ? lyrics[lyrics.length - 1].end : 30;

        // ===================================================
        // Create floating hearts for splash screen
        // ===================================================
        function createSplashHearts() {
            const splash = document.getElementById('splash-screen');
            const heartEmojis = ['💖', '💕', '💗', '💘', '💝', '♥️', '💓', '💞'];

            for (let i = 0; i < 30; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.fontSize = (Math.random() * 2 + 1) + 'rem';
                heart.style.animationDuration = (Math.random() * 5 + 4) + 's';
                heart.style.animationDelay = (Math.random() * 5) + 's';
                heart.style.opacity = Math.random() * 0.5 + 0.2;
                splash.appendChild(heart);
            }

            // Add sparkles
            for (let i = 0; i < 20; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.animationDuration = (Math.random() * 4 + 3) + 's';
                sparkle.style.animationDelay = (Math.random() * 5) + 's';
                sparkle.style.width = (Math.random() * 4 + 2) + 'px';
                sparkle.style.height = sparkle.style.width;
                splash.appendChild(sparkle);
            }
        }

        // ===================================================
        // Create mini hearts around teddy
        // ===================================================
        function createTeddyHearts() {
            const teddy = document.getElementById('teddy-screen');
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'mini-heart';
                heart.textContent = '💗';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.top = Math.random() * 100 + '%';
                heart.style.fontSize = (Math.random() * 1.5 + 0.5) + 'rem';
                heart.style.animationDelay = (Math.random() * 3) + 's';
                heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
                teddy.appendChild(heart);
            }
        }

        // ===================================================
        // Create background hearts for lyrics screen
        // ===================================================
        function createBgHearts() {
            const screen = document.getElementById('lyrics-screen');
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'bg-heart';
                heart.textContent = '💖';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.fontSize = (Math.random() * 1.5 + 0.8) + 'rem';
                heart.style.animationDuration = (Math.random() * 8 + 6) + 's';
                heart.style.animationDelay = (Math.random() * 10) + 's';
                screen.appendChild(heart);
            }
        }

        // ===================================================
        // Splash → Teddy transition
        // ===================================================
        document.getElementById('splash-screen').addEventListener('click', () => {
            const splash = document.getElementById('splash-screen');
            splash.classList.add('hide');
            setTimeout(() => {
                splash.style.display = 'none';
                const teddy = document.getElementById('teddy-screen');
                teddy.classList.add('show');
            }, 1000);
        });

        // ===================================================
        // Teddy → Lyrics transition
        // ===================================================
        document.getElementById('teddy-screen').addEventListener('click', () => {
            const teddy = document.getElementById('teddy-screen');
            teddy.classList.add('hide');
            setTimeout(() => {
                teddy.style.display = 'none';
                const lyricsScreen = document.getElementById('lyrics-screen');
                lyricsScreen.classList.add('show');
                playSong();
            }, 1000);
        });

        // ===================================================
        // Lyrics & Audio Engine
        // ===================================================
        const audio = document.getElementById('audio-player');
        const display = document.getElementById('lyrics-display');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const endMsg = document.getElementById('end-message');
        const playPauseBtn = document.getElementById('play-pause-btn');

        let currentIndex = -1;
        let updateInterval = null;

        function updateLyrics() {
            const elapsed = audio.currentTime;
            const duration = audio.duration || totalDuration;

            // Update progress bar
            const percent = Math.min((elapsed / duration) * 100, 100);
            progressBar.style.width = percent + '%';

            // Find matching lyric
            let activeIndex = -1;
            for (let i = 0; i < lyrics.length; i++) {
                if (elapsed >= lyrics[i].start && elapsed < lyrics[i].end) {
                    activeIndex = i;
                    break;
                }
            }

            if (activeIndex !== currentIndex) {
                if (activeIndex === -1) {
                    display.classList.remove('active');
                    display.classList.add('exit');
                } else {
                    display.classList.remove('active', 'exit');
                    display.textContent = lyrics[activeIndex].text;
                    void display.offsetWidth;
                    display.classList.add('active');
                }
                currentIndex = activeIndex;
            }
        }

        function playSong() {
            endMsg.classList.remove('show');
            audio.play().then(() => {
                playPauseBtn.textContent = '⏸ إيقاف مؤقت';
            }).catch(e => {
                console.log('Autoplay prevented:', e);
                playPauseBtn.textContent = '▶ تشغيل';
            });

            if (updateInterval) clearInterval(updateInterval);
            updateInterval = setInterval(updateLyrics, 50);
        }

        function togglePlayPause() {
            if (audio.ended) {
                resetLyrics();
                return;
            }
            if (audio.paused) {
                playSong();
            } else {
                audio.pause();
                playPauseBtn.textContent = '▶ تشغيل';
            }
        }

        function resetLyrics() {
            audio.pause();
            audio.currentTime = 0;
            currentIndex = -1;
            display.className = 'lyrics-line';
            display.textContent = '';
            display.style.opacity = '';
            progressBar.style.width = '0%';
            endMsg.classList.remove('show');
            playSong();
            updateLyrics();
        }

        audio.addEventListener('ended', () => {
            playPauseBtn.textContent = '🔄 إعادة من الأول';
            display.classList.remove('active');
            display.classList.add('exit');
            setTimeout(() => {
                endMsg.classList.add('show');
            }, 400);
        });

        // Click on progress bar to seek
        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const ratio = Math.max(0, Math.min(1, clickX / rect.width));
            const duration = audio.duration || totalDuration;
            audio.currentTime = ratio * duration;
            currentIndex = -1;
            endMsg.classList.remove('show');
            updateLyrics();
            if (audio.paused) {
                playSong();
            }
        });

        // ===================================================
        // Initialize
        // ===================================================
        createSplashHearts();
        createTeddyHearts();
        createBgHearts();
    </script>
</body>
</html>
